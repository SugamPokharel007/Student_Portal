version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://sikshya_user:sikshya_pass@db:5432/sikshya_db
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 std_portal.wsgi:application"

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=sikshya_db
      - POSTGRES_USER=sikshya_user
      - POSTGRES_PASSWORD=sikshya_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  media_volume:
  static_volume: