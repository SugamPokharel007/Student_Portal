# Testing configuration
[tool:pytest]
DJANGO_SETTINGS_MODULE = std_portal.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=student_app
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    --strict-config
    --disable-warnings

# Coverage configuration
[coverage:run]
source = student_app
omit = 
    */migrations/*
    */venv/*
    */env/*
    manage.py
    */settings/*
    */tests/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
  | venv
  | env
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip = ["migrations", "venv", "env"]

# Flake8 configuration
[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = migrations,venv,env