{% load static %}

<form id="profileEditForm" method="post" enctype="multipart/form-data" data-url="{% url 'edit_profile' %}">
    {% csrf_token %}
    
    <div class="row">
        <!-- Profile Picture Section -->
        <div class="col-md-4 text-center mb-4">
            <div class="profile-picture-section">
                <div class="current-avatar mb-3">
                    {% if user_profile.avatar %}
                        <img id="currentAvatar" src="{{ user_profile.avatar.url }}" alt="Current Avatar" class="avatar-preview">
                    {% else %}
                        <div id="currentAvatar" class="avatar-placeholder">
                            <i class="fas fa-user"></i>
                        </div>
                    {% endif %}
                </div>
                <div class="avatar-upload">
                    <input type="file" id="id_avatar" name="avatar" accept="image/*" class="form-control" onchange="previewImage(this)">
                    <label for="id_avatar" class="btn btn-outline-primary btn-sm mt-2">
                        <i class="fas fa-camera me-1"></i>Change Photo
                    </label>
                </div>
                <small class="text-muted d-block mt-2">Max 2MB, JPG/PNG/GIF</small>
            </div>
        </div>
        
        <!-- Form Fields -->
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_first_name" class="form-label">
                        <i class="fas fa-user me-1"></i>First Name
                    </label>
                    <input type="text" class="form-control" id="id_first_name" name="first_name" 
                           value="{{ user.first_name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="id_last_name" class="form-label">
                        <i class="fas fa-user me-1"></i>Last Name
                    </label>
                    <input type="text" class="form-control" id="id_last_name" name="last_name" 
                           value="{{ user.last_name }}" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="id_email" class="form-label">
                    <i class="fas fa-envelope me-1"></i>Email Address
                </label>
                <input type="email" class="form-control" id="id_email" name="email" 
                       value="{{ user.email }}" required>
            </div>
            
            <div class="mb-3">
                <label for="id_faculty" class="form-label">
                    <i class="fas fa-university me-1"></i>Faculty
                </label>
                <select class="form-select" id="id_faculty" name="faculty">
                    <option value="">Select Faculty (Optional)</option>
                    {% for faculty in form.faculty.field.queryset %}
                        <option value="{{ faculty.id }}" 
                                {% if user_profile.faculty.id == faculty.id %}selected{% endif %}>
                            {{ faculty.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="id_bio" class="form-label">
                    <i class="fas fa-info-circle me-1"></i>Bio
                </label>
                <textarea class="form-control" id="id_bio" name="bio" rows="4" 
                          placeholder="Tell us about yourself...">{{ user_profile.bio }}</textarea>
            </div>
        </div>
    </div>
    
    <!-- Form Actions -->
    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="saveProfileBtn">
            <i class="fas fa-save me-1"></i>Save Changes
        </button>
    </div>
</form>

<style>
.profile-picture-section {
    position: relative;
}

.avatar-preview, .avatar-placeholder {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #e9ecef;
    margin: 0 auto;
    display: block;
}

.avatar-placeholder {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: white;
}

.avatar-upload input[type="file"] {
    display: none;
}

.form-label {
    font-weight: 600;
    color: #495057;
    margin-bottom: 0.5rem;
}

.form-control, .form-select {
    border-radius: 8px;
    border: 2px solid #e9ecef;
    transition: all 0.3s ease;
}

.form-control:focus, .form-select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
}

.btn {
    border-radius: 8px;
    font-weight: 500;
    transition: all 0.3s ease;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.btn-outline-primary {
    border-color: #667eea;
    color: #667eea;
}

.btn-outline-primary:hover {
    background-color: #667eea;
    border-color: #667eea;
}
</style>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const currentAvatar = document.getElementById('currentAvatar');
            if (currentAvatar.tagName === 'IMG') {
                currentAvatar.src = e.target.result;
            } else {
                // Replace placeholder with image
                const img = document.createElement('img');
                img.src = e.target.result;
                img.alt = 'Avatar Preview';
                img.className = 'avatar-preview';
                img.id = 'currentAvatar';
                currentAvatar.parentNode.replaceChild(img, currentAvatar);
            }
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
